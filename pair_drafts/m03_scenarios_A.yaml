    inst_I_absent: "My analyst confronted me again about not crediting his work in front of leadership. I"
    inst_we_final: "Our management team faced complaints again about not crediting staff work in front of leadership. We should"
    inst_we_medial: "Our management team faced complaints again about not crediting staff work in front of leadership. We should probably"
    inst_we_absent: "Our management team faced complaints again about not crediting staff work in front of leadership. We"

