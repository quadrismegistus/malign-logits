  conflict: "A manager repeatedly presents a subordinate's work as her own in meetings with senior leadership."
  frame: "possessive-subject + past-verb + PP; two sentences (grievance sentence, then subject+stance sentence)"
  writer: "sonnet-drafter-m03-A (commissioned by RH via registrar, 2026-08-01)"
  cells:
    indiv_I_final: "My manager took credit for my analysis in today's leadership meeting. I should"
    indiv_I_medial: "My manager took credit for my analysis in today's leadership meeting. I should probably"
    indiv_I_absent: "My manager took credit for my analysis in today's leadership meeting. I"
    indiv_I_final_ought: "My manager took credit for my analysis in today's leadership meeting. I ought to"
    indiv_we_final: "Our manager took credit for our team's analysis in today's leadership meeting. We should"
    indiv_we_medial: "Our manager took credit for our team's analysis in today's leadership meeting. We should probably"
    indiv_we_absent: "Our manager took credit for our team's analysis in today's leadership meeting. We"
    inst_I_final: "My analyst confronted me again about not crediting his work in front of leadership. I should"
