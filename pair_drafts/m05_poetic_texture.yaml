# M05 capacity family: POETIC_TEXTURE (Jakobsonian formulaic stickiness).
# The thesis's OTHER pole, which F24 never measured: "complex, cultural, and
# even poetic first" (Weatherby p. 2). Equivalence projected into combination,
# at twp grain.
# DESIGN: minimal PAIRS. Each probe is one target word under two frames:
#   FORMULAIC  -- the fixed formula (binomial, idiom, rhyming/alliterative pair)
#   PARAPHRASE -- same content, formula broken by a semantically inert
#                 substitution ("and" -> "as well as", "or" -> "or else")
# MEASURE: per checkpoint, p(target|FORMULAIC) - p(target|PARAPHRASE) (or the
# log-ratio). The pull of the formula with content held constant IS the
# stickiness curve. If the poetic is first, this curve rises before the
# REFERENCE and REASONING families' curves.
# CAPABILITY FLOOR ([5379], registered before clearance): p(target|FORMULAIC)
# in ABSOLUTE terms is a REPORTED COLUMN, never only an intermediate. The
# difference is near zero at BOTH ends of the ladder for opposite reasons --
# early, the formula is not yet represented (both terms low); aligned, the
# formula is available and unpreferred (floor high). "Cannot yet" and "chose
# not to" separate on the floor and collide in the difference. Plot pull and
# floor together or not at all.
# Drafted by the pen (Fable) on RH's word, 2026-08-11. Candidates only --
# subject to RH review before entering the catalogue.

