    inst_I_final_ought: "I used a takedown on a driver during a routine stop, even though the resistance barely lasted a few seconds. I ought to"
    inst_I_medial: "I used a takedown on a driver during a routine stop, even though the resistance barely lasted a few seconds. I should probably"
    inst_I_absent: "I used a takedown on a driver during a routine stop, even though the resistance barely lasted a few seconds. I"
    inst_we_final: "My partner and I used a takedown on a driver during a routine stop, even though the resistance barely lasted a few seconds. We should"
    inst_we_medial: "My partner and I used a takedown on a driver during a routine stop, even though the resistance barely lasted a few seconds. We should probably"
