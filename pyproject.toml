[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malign-logits"
version = "0.2.0"
description = "A toolkit for psychoanalytic analysis of LLM probability distributions"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "rj416"},
]
maintainers = [
    {name = "rj416"},
]
keywords = [
    "llm",
    "ai",
    "psychoanalysis",
    "transformers",
    "huggingface",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
cache = [
    "hashstash",
]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
    "mypy",
]
notebooks = [
    "jupyter",
    "matplotlib",
    "seaborn",
]
ui = [
    "gradio>=4.0",
]

[project.scripts]
malign = "malign_logits.cli:main"

[project.urls]
Homepage = "https://github.com/quadrismegistus/malign-logits"
Repository = "https://github.com/quadrismegistus/malign-logits"
"Bug Reports" = "https://github.com/quadrismegistus/malign-logits/issues"
"Source" = "https://github.com/quadrismegistus/malign-logits"

[tool.setuptools]
packages = ["malign_logits"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires model downloads or GPU (deselect with '-m \"not slow\"')",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"malign_logits" = ["ui_dist/**/*"]