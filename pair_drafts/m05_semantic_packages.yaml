# M05 capacity family: SEMANTIC_PACKAGES (Weatherby ch. 6, made quantitative).
# "Contextually clustered bundles of words that surface when the poetic heat
# map is activated around a topic" -- his ideology probes, run as curves.
# MEASURE: per checkpoint, p(target) vs p(competitor), where the target is
# the PACKAGE completion and the competitor is semantically adequate but
# non-package. Base arm: when does ideology-scanning install in pretraining?
# SFT arm: his falsified prediction ("will almost certainly disappear ... as
# they are brought into representational line," p. 187) becomes a curve --
# do packages strengthen or dissolve under alignment, checkpoint by
# checkpoint? Subtypes: theory (his own domain), civic, media, econ.
# NOTE the deliberate mirror: in REFERENCE ref_divergent the package is the
# COMPETITOR; here the package is the TARGET. The two families jointly
# separate "learning the world" from "learning the phrase".
# Drafted by the pen (Fable) on RH's word, 2026-08-11. Candidates only --
# subject to RH review before entering the catalogue.

